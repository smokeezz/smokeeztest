<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SMOKEEZ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     SMOKEEZ — LIQUID GLASS
     Прозрачные стеклянные поверхности, размытие фона, блики по краям,
     плавающие панели, живой цветной фон.
     ===================================================================== */
  :root{
    --bg:#07040f;
    --panel:rgba(255,255,255,0.07);
    --panel2:rgba(255,255,255,0.09);
    --panel3:rgba(255,255,255,0.12);
    --line:rgba(255,255,255,0.16);
    --line-soft:rgba(255,255,255,0.11);
    --text:#fbf7ff;
    --muted:rgba(236,226,250,0.68);
    --muted-dim:rgba(220,208,240,0.48);
    --magenta:#ff4fe0;
    --violet:#8b6bff;
    --ok:#4ade9d;
    --no:#ff7a92;
    --gold:#ffcf4d;
    --radius:24px;
    --nav-h:68px;
    --safe-b:env(safe-area-inset-bottom, 0px);

    /* стекло */
    --blur:blur(22px) saturate(180%);
    --blur-strong:blur(34px) saturate(200%);
    --glass-fill:linear-gradient(145deg, rgba(255,255,255,0.17) 0%, rgba(255,255,255,0.06) 38%, rgba(255,255,255,0.05) 62%, rgba(255,255,255,0.11) 100%);
    --glass-edge:rgba(255,255,255,0.20);
    --glass-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.42),
      inset 0 -1px 0 rgba(255,255,255,0.08),
      inset 1px 0 0 rgba(255,255,255,0.10),
      inset -1px 0 0 rgba(255,255,255,0.10),
      inset 0 0 22px rgba(255,255,255,0.045),
      0 10px 32px -10px rgba(0,0,0,0.55);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:101vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.display{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    letter-spacing:-0.025em;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--magenta);color:#100815;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);border-radius:99px;}

  /* ---------- живой фон: цветные «жидкие» пятна под стеклом ---------- */
  .smoke-field{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    background:
      radial-gradient(70% 50% at 12% 6%, rgba(139,107,255,0.45), transparent 62%),
      radial-gradient(55% 45% at 95% 18%, rgba(255,79,224,0.34), transparent 62%),
      radial-gradient(70% 55% at 55% 105%, rgba(56,130,255,0.30), transparent 62%),
      var(--bg);
  }
  .smoke-field::before,
  .smoke-field::after{
    content:'';
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.5;
    will-change:transform;
  }
  .smoke-field::before{
    width:46vw;height:46vw;
    background:#ff5fa8;
    top:52%;left:-18%;
    animation:drift 30s ease-in-out infinite alternate-reverse;
  }
  .smoke-field::after{
    width:40vw;height:40vw;
    background:#22d3ee;
    top:8%;left:42%;
    opacity:0.28;
    animation:drift 34s ease-in-out infinite alternate;
    animation-delay:-11s;
  }
  .smoke-field .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(64px);
    opacity:0.55;
    animation: drift 24s ease-in-out infinite alternate;
    will-change:transform;
  }
  .smoke-field .b1{width:66vw;height:66vw;background:var(--violet);top:-16%;left:-22%;}
  .smoke-field .b2{width:58vw;height:58vw;background:var(--magenta);top:28%;right:-28%;animation-delay:-8s;}
  .smoke-field .b3{width:56vw;height:56vw;background:#3b5bff;bottom:-18%;left:18%;animation-delay:-14s;}
  @keyframes drift{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(8%, -5%) scale(1.12);}
    100%{transform:translate(-6%, 8%) scale(1.04);}
  }
  .particle{
    position:absolute;
    bottom:-40px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.55), rgba(255,120,235,0.18) 55%, transparent 75%);
    filter:blur(1px);
    opacity:0;
    animation-name:floatUp;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    8%{opacity:0.55;}
    88%{opacity:0.3;}
    100%{transform:translateY(-115vh) translateX(var(--drift,24px)); opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .smoke-field .blob, .smoke-field::before, .smoke-field::after, .particle{animation:none;}
    html{scroll-behavior:auto;}
  }

  /* ---------- общая «стеклянная» поверхность ---------- */
  .cart-item,.cart-summary,.co-step,.profile-card,.order-card,.promo-box,
  .icon-btn,.back-btn,.qty-stepper,.search-wrap input,.cat-chip,.flavor-chip,
  .stock-toggle .box,.method-toggle button,.contact-toggle button,.pay-opt,
  .field input,.field select,.btn-ghost,.fav-btn,.toast{
    background:var(--glass-fill);
    border:1px solid var(--glass-edge);
    box-shadow:var(--glass-shadow);
    -webkit-backdrop-filter:var(--blur);
    backdrop-filter:var(--blur);
  }

  /* ---------- header: плавающая стеклянная капсула ---------- */
  header.topbar{
    position:sticky;
    top:calc(8px + env(safe-area-inset-top, 0px));
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:8px 12px 0;
    padding:8px 10px 8px 18px;
    border-radius:999px;
    background:var(--glass-fill);
    border:1px solid var(--glass-edge);
    box-shadow:var(--glass-shadow);
    -webkit-backdrop-filter:var(--blur-strong);
    backdrop-filter:var(--blur-strong);
  }
  .brand{display:flex;align-items:center;gap:8px;}
  .brand img{height:26px;display:block;filter:drop-shadow(0 0 10px rgba(255,79,224,0.45));}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    position:relative;
    width:40px;height:40px;
    border-radius:50%;
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:1.05rem;
    transition:transform .35s var(--spring);
  }
  .icon-btn:active{transform:scale(0.86);}
  .icon-btn .badge{
    position:absolute;top:-4px;right:-4px;
    min-width:18px;height:18px;padding:0 5px;
    border-radius:99px;
    background:linear-gradient(135deg, #ff6ae8, var(--violet));
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.55), 0 4px 12px -2px rgba(255,79,224,0.7);
    color:#fff;font-size:0.62rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
  }

  /* ---------- layout / views ---------- */
  main#app{
    max-width:640px;
    margin:0 auto;
    padding:14px 14px calc(var(--nav-h) + var(--safe-b) + 40px);
    min-height:calc(100vh - 54px);
  }
  .view{display:none;}
  .view.active{display:block;animation:fadeIn .45s var(--spring);}
  @keyframes fadeIn{from{opacity:0; transform:translateY(14px) scale(0.985);} to{opacity:1; transform:translateY(0) scale(1);}}

  .section-title{
    font-size:1.6rem;
    color:var(--text);
    margin:16px 4px 14px;
    display:flex;align-items:center;gap:8px;
    text-shadow:0 2px 20px rgba(255,79,224,0.35);
  }
  .section-title .count{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:0.72rem;color:var(--muted-dim);letter-spacing:0;text-shadow:none;}

  /* ---------- filter bar ---------- */
  .search-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .search-wrap{position:relative;margin-bottom:0;flex:1 1 auto;min-width:0;}
  .search-wrap input{
    width:100%;
    padding:12px 16px 12px 42px;
    border-radius:999px;
    color:var(--text);
    font-family:'Manrope',sans-serif;
    font-size:0.92rem;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search-wrap input::placeholder{color:var(--muted-dim);}
  .search-wrap input:focus{border-color:rgba(255,140,240,0.75);box-shadow:var(--glass-shadow), 0 0 0 4px rgba(255,79,224,0.18);}
  .search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:0.65;width:15px;height:15px;z-index:1;}
  .stock-toggle{display:flex;align-items:center;gap:8px;font-size:0.72rem;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;flex:0 0 auto;}
  .stock-toggle .box{width:46px;height:28px;border-radius:999px;position:relative;transition:background .25s, border-color .25s;flex:0 0 auto;}
  .stock-toggle .box::after{
    content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
    background:linear-gradient(180deg,#fff,#e9e1f5);
    box-shadow:0 2px 6px rgba(0,0,0,0.4), inset 0 -1px 2px rgba(0,0,0,0.12);
    transition:left .35s var(--spring), width .2s;
  }
  .stock-toggle:active .box::after{width:27px;}
  .stock-toggle input{display:none;}
  .stock-toggle input:checked + .box{background:linear-gradient(135deg, rgba(74,222,157,0.75), rgba(34,197,120,0.6));border-color:rgba(160,255,210,0.6);}
  .stock-toggle input:checked + .box::after{left:20px;}
  .stock-toggle input:checked:active + .box::after{left:15px;}
  .chip-filters{
    display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;
    padding:6px 4px 10px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .chip-filters::-webkit-scrollbar{display:none;height:0;}
  .cat-chip{
    -webkit-backdrop-filter:none;backdrop-filter:none; /* внутри прокрутки — без блюра, иначе появляется полоса */
    flex:0 0 auto;
    padding:9px 17px;
    border-radius:999px;
    color:var(--muted);
    font-size:0.82rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .35s var(--spring), background .25s, color .2s, box-shadow .25s;
  }
  .cat-chip:active{transform:scale(0.93);}
  .cat-chip.active,
  .flavor-chip.selected{
    background:linear-gradient(145deg, rgba(255,110,235,0.78), rgba(139,107,255,0.7));
    color:#fff;
    border-color:rgba(255,190,245,0.7);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.6),
      inset 0 -6px 14px rgba(120,40,200,0.28),
      0 8px 22px -6px rgba(255,79,224,0.65);
  }

  /* ---------- product grid / cards ---------- */
  .product-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    margin-top:12px;
  }
  /* без backdrop-filter: фон и так мягкий, а длинный список карточек
     со стеклом-размытием тормозит на телефонах */
  .product-card{
    position:relative;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,0.14), transparent 60%),
      linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03) 55%, rgba(255,79,224,0.07));
    border:1px solid rgba(255,140,235,0.42);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform .35s var(--spring), border-color .25s ease, box-shadow .25s ease;
    display:flex;flex-direction:column;
    animation:neonPulse 3.8s ease-in-out infinite;
  }
  .product-card::after{ /* верхний блик стекла */
    content:'';position:absolute;left:10%;right:10%;top:0;height:1.5px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
    pointer-events:none;
  }
  .product-card:nth-child(3n+2){ animation-delay:-1.3s; }
  .product-card:nth-child(3n+3){ animation-delay:-2.5s; }
  .product-card:hover, .product-card:active{
    border-color:rgba(255,170,240,0.85);
  }
  @keyframes neonPulse{
    0%, 100% {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 0 18px rgba(255,255,255,0.04),
        0 0 8px 0 rgba(255,90,220,0.28),
        0 10px 26px -12px rgba(0,0,0,0.6);
    }
    50% {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.45),
        inset 0 0 18px rgba(255,255,255,0.06),
        0 0 16px 1px rgba(255,90,220,0.5),
        0 10px 26px -12px rgba(0,0,0,0.6);
    }
  }
  .product-card:active{transform:scale(0.95);}
  .thumb{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .thumb img{width:100%;height:100%;object-fit:contain;display:block;padding:14px;filter:drop-shadow(0 12px 16px rgba(0,0,0,0.4));}
  .thumb .placeholder{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;
    color:var(--muted-dim);
    text-align:center;
    padding:10px;
    background:linear-gradient(150deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  }
  .thumb .placeholder svg{width:30px;height:30px;opacity:0.5;}
  .thumb .placeholder span{font-size:0.62rem;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;line-height:1.3;}
  .thumb .tag{
    position:absolute;top:9px;left:9px;
    padding:4px 10px;
    border-radius:99px;
    font-size:0.62rem;
    font-weight:800;
    font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.03em;
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
  }
  .tag.promo{background:linear-gradient(135deg,#ffe07a,#ffb938);color:#2a1a02;box-shadow:inset 0 1px 0 rgba(255,255,255,0.7), 0 4px 12px -3px rgba(255,185,56,0.6);}
  .tag.out{background:rgba(255,122,146,0.22);color:#ffc2cd;border:1px solid rgba(255,150,170,0.5);box-shadow:inset 0 1px 0 rgba(255,255,255,0.25);}
  .fav-btn{
    position:absolute;top:9px;right:9px;z-index:2;
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:0.98rem;cursor:pointer;
    color:#fff;
    transition:transform .35s var(--spring), color .2s;
  }
  .fav-btn:active{transform:scale(0.8);}
  .fav-btn.active{color:var(--magenta);text-shadow:0 0 12px rgba(255,79,224,0.9);}
  .pd-hero .fav-btn{top:14px;right:14px;width:42px;height:42px;font-size:1.25rem;}
  .card-body{padding:6px 13px 14px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card-body .name{font-size:0.86rem;font-weight:800;line-height:1.25;color:var(--text);letter-spacing:-0.01em;}
  .card-body .meta{font-size:0.68rem;color:var(--muted-dim);font-family:'JetBrains Mono',monospace;}
  .card-body .price{margin-top:auto;font-family:'Manrope',sans-serif;font-weight:800;font-size:1.12rem;letter-spacing:-0.02em;color:#fff;padding-top:4px;text-shadow:0 0 18px rgba(255,79,224,0.8);}
  .card-body .price.ask{font-size:0.74rem;color:var(--muted);text-shadow:none;font-weight:700;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--muted-dim);}
  .empty-state svg{width:40px;height:40px;opacity:0.4;margin-bottom:12px;}

  /* ---------- product detail ---------- */
  .back-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .back-btn{
    width:40px;height:40px;border-radius:50%;color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .35s var(--spring);
  }
  .back-btn:active{transform:scale(0.86);}
  .pd-hero{
    width:100%;aspect-ratio:1/1;max-height:340px;
    border-radius:var(--radius);
    background:radial-gradient(60% 55% at 50% 55%, rgba(255,90,225,0.26), rgba(139,107,255,0.10) 55%, transparent 75%);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
    border:none;
  }
  .pd-hero img{width:100%;height:100%;object-fit:contain;padding:28px;filter:drop-shadow(0 20px 26px rgba(0,0,0,0.45));}
  .pd-hero .placeholder{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted-dim);text-align:center;padding:20px;background:linear-gradient(150deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));}
  .pd-hero .placeholder svg{width:52px;height:52px;opacity:0.5;}
  .pd-hero .placeholder span{font-size:0.72rem;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;}
  .pd-title{margin-top:16px;font-size:1.75rem;line-height:1.15;color:var(--text);}
  .pd-price{margin-top:8px;font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:-0.02em;font-size:1.5rem;color:#fff;text-shadow:0 0 22px rgba(255,79,224,0.85);}
  .pd-price.ask{font-weight:700;font-size:0.95rem;color:var(--muted);text-shadow:none;}
  .pd-desc{margin-top:12px;color:var(--muted);font-size:0.9rem;line-height:1.6;}
  .pd-block{margin-top:22px;}
  .pd-block .lbl{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted-dim);font-family:'JetBrains Mono',monospace;margin-bottom:10px;}
  .flavor-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .flavor-chip{
    padding:10px 15px;border-radius:999px;
    color:var(--text);font-size:0.82rem;font-weight:700;
    cursor:pointer;display:flex;align-items:center;gap:7px;
    transition:transform .35s var(--spring), background .25s, box-shadow .25s;
  }
  .flavor-chip:active{transform:scale(0.93);}
  .flavor-chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor;}
  .flavor-chip.out{opacity:0.4;cursor:not-allowed;color:var(--muted-dim);text-decoration:line-through;}
  .qty-stepper{display:inline-flex;align-items:center;gap:0;border-radius:999px;overflow:hidden;}
  .qty-stepper button{width:44px;height:44px;border:none;background:transparent;color:var(--text);font-size:1.15rem;cursor:pointer;transition:background .2s;}
  .qty-stepper button:active{background:rgba(255,255,255,0.18);}
  .qty-stepper .val{min-width:36px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:600;}
  .pd-actions{display:flex;gap:10px;margin-top:26px;}
  .pd-note{margin-top:14px;font-size:0.76rem;color:var(--muted-dim);}

  .btn{
    position:relative;overflow:hidden;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:15px 20px;border-radius:999px;font-weight:800;font-size:0.88rem;
    font-family:inherit;text-decoration:none;border:1px solid transparent;
    cursor:pointer;transition:transform .35s var(--spring), box-shadow .25s ease, filter .2s ease;
    white-space:nowrap;flex:1;
  }
  .btn:active{transform:scale(0.95);filter:brightness(1.1);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary{
    background:linear-gradient(145deg, rgba(255,95,232,0.92), rgba(139,107,255,0.9));
    border-color:rgba(255,200,248,0.65);
    color:#fff;
    text-shadow:0 1px 2px rgba(80,0,120,0.35);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.65),
      inset 0 -10px 18px rgba(110,30,190,0.3),
      0 12px 30px -8px rgba(255,79,224,0.7);
  }
  .btn-primary::before{ /* стеклянный блик на верхней половине */
    content:'';position:absolute;left:4%;right:4%;top:2px;height:48%;
    border-radius:999px 999px 60% 60%;
    background:linear-gradient(180deg, rgba(255,255,255,0.38), rgba(255,255,255,0));
    pointer-events:none;
  }
  .btn-ghost{color:var(--text);}
  .btn-ghost:hover{filter:brightness(1.15);}
  .btn-wide{width:100%;flex:none;}
  .btn-block{display:flex;width:100%;}

  /* ---------- cart ---------- */
  .cart-item{
    display:flex;gap:12px;padding:12px;border-radius:22px;margin-bottom:10px;
  }

  nav.bottom-nav{

  /* запасной вариант для браузеров без backdrop-filter */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){

  }
</style>

<body>

<script>
/* ======================================================================
   НАСТРОЙКИ — заполни перед публикацией
   ====================================================================== */
const CONFIG = {
  // Адрес твоего Cloudflare Worker (после деплоя)
  ORDER_ENDPOINT: 'https://smokeez-orders.hchpfckj6h.workers.dev/',
  // Тот же пароль, что ты задал в Cloudflare как секрет APP_KEY
  APP_KEY: '13-11-2007Mar',
  // Запасной вариант связи, если сервер ещё не настроен — юзернейм в Telegram (без @)
  OWNER_USERNAME: 'znllxs',
  SHOP_NAME: 'SMOKEEZ'
};
/* Как это работает:
   1) Пока BOT_TOKEN / OWNER_CHAT_ID не заполнены — заказ копируется в буфер обмена
      и открывается чат с OWNER_USERNAME, клиенту останется вставить и отправить.
   2) Когда впишешь токен и chat_id — заказы будут прилетать тебе в Telegram
      автоматически, без участия клиента.
   3) Когда сайт будет захостен (например GitHub Pages), пропиши его адрес в BotFather:
      /newapp → выбери бота → укажи URL сайта. Так на кнопке в боте откроется Mini App. */

/* ======================================================================
   КАТАЛОГ
   ====================================================================== */
const CATEGORIES = [
  {key:'liquid', label:'Жидкости'},
  {key:'disposable', label:'Одноразки'},
  {key:'pod', label:'POD-системы'},
  {key:'cartridge', label:'Картриджи'},
  {key:'snus', label:'Снюс'},
];
const EMPTY_CATEGORY_MSG = {
  disposable: 'Одноразки скоро появятся в каталоге — следи за обновлениями.'
};

function L(name, category, items, extra){ return Object.assign({name, category, items}, extra||{}); }
function F(list, val){ return list.map(n => ({n, ok: val, qty: null})); }
function P(pairs){ return pairs.map(([n,ok]) => ({n, ok, qty: null})); }
// Q — вкусы с известным точным остатком на складе (по факту наличия), qty=0 значит "нет в наличии"
function Q(pairs){ return pairs.map(([n,qty]) => ({n, qty, ok: qty > 0})); }

/* ======================================================================

   ====================================================================== */
function slugify(str){
  const map = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
  return str.toLowerCase().split('').map(ch=>map[ch]!==undefined?map[ch]:ch).join('')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function priceFor(line){
  if(line.category === 'liquid'){
    if(/^Vozol Prime/i.test(line.name)) return 11.00;
    if(/^ElfLiq/i.test(line.name)) return 11.00;
    if(/^Puffy/i.test(line.name)) return 11.00;
    if(/^Chaser/i.test(line.name)) return 10.50;
  }
  if(line.category === 'pod'){
    if(/^Vaporesso Xros 4 Mini/i.test(line.name)) return 16.90;
    if(/^Vaporesso Xros 5 Mini/i.test(line.name)) return 20.90;
    if(/^Vaporesso Xros 5(?!\s*Mini)/i.test(line.name)) return 25.90;
    if(/^Vaporesso Xros Pro 2/i.test(line.name)) return 32.90;
    if(/^Vaporesso Xros 6 Mini/i.test(line.name)) return 19.50;
    if(/^Vaporesso Xros 6(?!\s*Mini)/i.test(line.name)) return 22.50;
  }
  if(line.name === 'Картриджи Xros') return 4.00;
  if(line.category === 'snus') return 5.00;
  if(line.promo){
    const m = line.promo.match(/([\d,.]+)\s*€/);
    if(m) return parseFloat(m[1].replace(',','.'));
  }
  return null;
}
function unitFor(line){
  if(line.category === 'liquid') return 'флакон';
  if(line.category === 'snus') return 'банка';
  return 'шт';
}
function variantLabelFor(line){
  if(line.category === 'liquid' || line.category === 'disposable' || line.category === 'snus') return 'Вкус';
  if(/картридж/i.test(line.name)) return 'Вариант';
  return 'Цвет';
}

const PRODUCTS = RAW.map((line, idx) => {
  const id = 'p' + idx + '-' + slugify(line.name);
  return {
    id,
    idx,
    name: line.name,
    category: line.category,
    items: line.items,
    price: priceFor(line),
    unit: unitFor(line),
    variantLabel: variantLabelFor(line),
    desc: line.desc || '',
    note: line.note || '',
    promo: line.promo || '',
    img: slugify(line.name) + '.png'
  };
});
/* ======================================================================
   ЖИВОЙ ОСТАТОК СКЛАДА
   ------------------------------------------------------------------
   Для позиций, где известно точное количество единиц (Q(...) в RAW),
   ниже ведётся "живой" счётчик остатка: он уменьшается на количество
   единиц каждый раз, когда заказ реально отправляется (submitOrder),
   и как только остаток по вкусу доходит до 0 — на сайте эта позиция
   сразу помечается "нет в наличии", без ручного вмешательства.
   ВАЖНО: т.к. это статический сайт без сервера, счётчик хранится в
   localStorage этого браузера/устройства. Если заказы будут приходить
   с разных устройств одновременно, для по-настоящему общего остатка
   на все устройства нужен небольшой бэкенд (например, Google Sheet
   через Apps Script или простой сервер) — тогда функции ниже
   (stockKey/remainingQty/decrementStock) достаточно переключить на
   запросы к нему вместо localStorage.
   ====================================================================== */
function stockKey(productId, flavorName){ return productId + '::' + flavorName; }
let STOCK = storeGet('smokeez_stock_v1', null);
if(!STOCK){
  STOCK = {};
  PRODUCTS.forEach(p => p.items.forEach(it => {
    if(it.qty !== null && it.qty !== undefined) STOCK[stockKey(p.id, it.n)] = it.qty;
  }));
  storeSet('smokeez_stock_v1', STOCK);
}
function remainingQty(productId, flavorName){
  const k = stockKey(productId, flavorName);
  return STOCK.hasOwnProperty(k) ? STOCK[k] : null; // null = количество не отслеживается (неограниченно)
}
function isAvailable(productId, item){
  const r = remainingQty(productId, item.n);
  if(r === null) return item.ok; // товар без точного остатка — используем статический флаг
  return r > 0;
}
function decrementStock(productId, flavorName, qty){
  const k = stockKey(productId, flavorName);
  if(!STOCK.hasOwnProperty(k)) return;
  STOCK[k] = Math.max(0, STOCK[k] - qty);
  storeSet('smokeez_stock_v1', STOCK);
}

function getUid(){
  if(tgUser && tgUser.id) return 'tg' + tgUser.id;
  let g = localStorage.getItem('smokeez_guest_id');
  if(!g){ g = 'guest' + Math.random().toString(36).slice(2,10); localStorage.setItem('smokeez_guest_id', g); }
  return g;
}
const UID = getUid();
function storeGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function storeSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function getPromoCode(){
  const str = String(UID);
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = (hash*31 + str.charCodeAt(i)) >>> 0; }
  return 'SMKZ-' + (10000 + (hash % 90000));
}

// Общие промокоды магазина. expires — дата (включительно), после которой код перестаёт работать.
const PROMO_CODES = {
  'SMKZMINIAPP': { percent:20, expires:'2026-09-25', oneTimePerUser:true, label:'Промокод на запуск мини-аппа' },
  'SKIDOCHKA-SMKZ': { amount:1.5, expires:'2026-10-31', oneTimePerUser:true, minTotal:10, label:'Промокод на скидку' },
  'INST-SMKZ': { amount:1, expires:'2026-10-31', oneTimePerUser:true, minTotal:10, label:'Промокод на скидку' }
};
const REFERRAL_DISCOUNT_PERCENT = 10;   // скидка другу по чужому личному промокоду (только первый заказ)
const REFERRAL_BONUS_POINTS = 50;       // баллы пригласившему за друга, который сделал первый заказ
const POINTS_PER_10_EUR = 100;          // баллов за каждые полных 10€ фактически оплаченной суммы
const POINTS_TO_REDEEM = 1000;          // сколько баллов нужно для купона
const REDEEM_COUPON_AMOUNT = 10;        // фиксированная скидка по купону за баллы, в €

function normalizePromo(code){ return (code||'').trim().toUpperCase(); }

function getPoints(){ return storeGet('smokeez_points_' + UID, 0); }
function addPoints(n){ if(!n) return; storeSet('smokeez_points_' + UID, getPoints() + n); }
function spendPoints(n){ storeSet('smokeez_points_' + UID, Math.max(0, getPoints() - n)); }

function getRewardCoupons(){ return storeGet('smokeez_rewards_' + UID, []); } // [{code, percent, used}]
function saveRewardCoupons(list){ storeSet('smokeez_rewards_' + UID, list); }
function redeemPointsForCoupon(){
  if(getPoints() < POINTS_TO_REDEEM) return null;
  spendPoints(POINTS_TO_REDEEM);
  const code = 'SMKZ-BONUS-' + Math.random().toString(36).slice(2,7).toUpperCase();
  const list = getRewardCoupons();
  list.push({code, amount:REDEEM_COUPON_AMOUNT, used:false});
  saveRewardCoupons(list);
  return code;
}

// Общий "журнал" рефералов — на этом устройстве связывает личный промокод пригласившего
// с накопленными баллами/числом друзей. Как и остаток склада (STOCK), это localStorage-заглушка:
// чтобы баллы начислялись пригласившему по-настоящему на любом устройстве, этот блок нужно
// заменить на запросы к общему бэкенду.
function getReferralLedger(){ return storeGet('smokeez_referral_ledger', {}); }
function saveReferralLedger(l){ storeSet('smokeez_referral_ledger', l); }
function creditReferral(referrerCode){
  const ledger = getReferralLedger();
  if(!ledger[referrerCode]) ledger[referrerCode] = {invited:0, points:0};
  ledger[referrerCode].invited += 1;
  ledger[referrerCode].points += REFERRAL_BONUS_POINTS; // ждёт, пока пригласивший зайдёт в профиль и заберёт баллы
  saveReferralLedger(ledger);
}
function myReferralStats(){
  const ledger = getReferralLedger();
  return ledger[getPromoCode()] || {invited:0, points:0};
}
// Переносит накопленные за рефералов баллы из общего журнала на личный счёт пользователя.
// Вызывается при каждом открытии профиля.
function claimReferralPoints(){
  const ledger = getReferralLedger();
  const mine = ledger[getPromoCode()];
  if(mine && mine.points > 0){
    addPoints(mine.points);
    mine.points = 0;
    saveReferralLedger(ledger);
  }
}

function findPromo(raw){
  const code = normalizePromo(raw);
  if(!code) return {ok:false, error:'Введи промокод'};
  if(PROMO_CODES[code]){
    const promo = PROMO_CODES[code];
    if(promo.expires && new Date() > new Date(promo.expires + 'T23:59:59')) return {ok:false, error:'Срок действия промокода истёк'};
    if(promo.oneTimePerUser && storeGet('smokeez_used_promo_' + code + '_' + UID, false)) return {ok:false, error:'Этот промокод уже был использован'};
    if(promo.minTotal && cartTotal() < promo.minTotal) return {ok:false, error:`Минимальная сумма заказа для этого промокода — ${promo.minTotal} €`};
    return {ok:true, code, percent:promo.percent, amount:promo.amount, kind:'global'};
  }
  const reward = getRewardCoupons().find(r => r.code === code && !r.used);
  if(reward) return {ok:true, code, amount:reward.amount, kind:'reward'};
  if(/^SMKZ-\d{5}$/.test(code)){
    if(code === getPromoCode()) return {ok:false, error:'Нельзя применить свой собственный промокод'};
    if(orders.length > 0) return {ok:false, error:'Промокод друга действует только на первый заказ'};
    if(storeGet('smokeez_used_referral_' + UID, false)) return {ok:false, error:'Промокод друга уже был использован'};
    return {ok:true, code, percent:REFERRAL_DISCOUNT_PERCENT, kind:'referral'};
  }
  return {ok:false, error:'Такой промокод не найден'};
}
function applyPromoSideEffects(applied){
  if(!applied) return;
  if(applied.kind === 'global') storeSet('smokeez_used_promo_' + applied.code + '_' + UID, true);
  else if(applied.kind === 'reward'){
    const list = getRewardCoupons();
    const r = list.find(x => x.code === applied.code);
    if(r) r.used = true;
    saveRewardCoupons(list);
  }else if(applied.kind === 'referral'){
    storeSet('smokeez_used_referral_' + UID, true);
    creditReferral(applied.code);
  }
}

let activeCat = 'all';

let cart = storeGet('smokeez_cart_' + UID, []); // [{productId, flavor, qty}]
let orders = storeGet('smokeez_orders_' + UID, []);
let favorites = new Set(storeGet('smokeez_favs_' + UID, []));
let checkout = { method:'delivery', payment:'card', contactType:'telegram', age21:false, promo:null };
let pendingFlavor = null;

function productById(id){ return PRODUCTS.find(p => p.id === id); }
function cartTotal(){
  return cart.reduce((sum, ci) => { const p = productById(ci.productId); return sum + (p && p.price ? p.price * ci.qty : 0); }, 0);
}
function cartCount(){ return cart.reduce((s, ci) => s + ci.qty, 0); }
function cartDiscountedTotal(){
  const total = cartTotal();
  if(checkout.promo){
    if(checkout.promo.amount) return Math.max(0, total - checkout.promo.amount);
    if(checkout.promo.percent) return total * (1 - checkout.promo.percent/100);
  }
  return total;
}
function isFavorite(id){ return favorites.has(id); }
function toggleFavorite(id){
  if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
  storeSet('smokeez_favs_' + UID, [...favorites]);
}

function goto(view){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('nav.bottom-nav button[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  window.scrollTo(0,0);
  if(view === 'cart') renderCart();
  if(view === 'profile') renderProfile();
  if(view === 'catalog') renderCatalog();
  if(view === 'favorites') renderFavorites();
  if(view === 'home') renderHome();
}
document.querySelectorAll('nav.bottom-nav button[data-view]').forEach(btn => {
  btn.addEventListener('click', () => { haptic('light'); goto(btn.dataset.view); });
});
document.getElementById('topCartBtn').addEventListener('click', () => { haptic('light'); goto('cart'); });
document.querySelectorAll('[data-back]').forEach(btn => {
  btn.addEventListener('click', () => goto(btn.dataset.back));
});

function refreshCartBadges(){
  const n = cartCount();
  const top = document.getElementById('topCartBadge');
  const nav = document.getElementById('navCartBadge');
  [top, nav].forEach(el => {
    if(n > 0){ el.style.display = 'flex'; el.textContent = n; }
    else{ el.style.display = 'none'; }
  });
}

}

function thumbHtml(product, size){
  const ph = `<div class="placeholder" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 11h18"/></svg>
      <span>${size==='sm' ? '' : 'фото скоро будет'}</span>
    </div>`;
  return `<img src="${product.img}" alt="${product.name}" loading="lazy"
      onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">${ph}`;
}

function buildCatFilters(){
  const el = document.getElementById('catFilters');
  el.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'cat-chip' + (activeCat==='all' ? ' active' : '');
  all.textContent = 'Всё';
  all.addEventListener('click', () => { activeCat = 'all'; renderCatalog(); });
  el.appendChild(all);
  CATEGORIES.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (activeCat===c.key ? ' active' : '');
    chip.textContent = c.label;
    chip.addEventListener('click', () => { activeCat = c.key; renderCatalog(); });
    el.appendChild(chip);
  });
}

function productCardHtml(p){
  const availCount = p.items.filter(i => isAvailable(p.id, i)).length;
  const allOut = availCount === 0;
  const priceHtml = p.price
    ? `<div class="price">${p.price.toFixed(2).replace('.',',')} €</div>`
    : `<div class="price ask">Цена по запросу</div>`;
  const tag = p.promo
    ? `<span class="tag promo">${p.promo}</span>`
    : (allOut ? `<span class="tag out">Нет в наличии</span>` : '');
  const fav = isFavorite(p.id);
  return `<div class="product-card" data-id="${p.id}">
      <div class="thumb">${tag}<button type="button" class="fav-btn ${fav?'active':''}" data-fav="${p.id}">${fav ? '♥' : '♡'}</button>${thumbHtml(p)}</div>
      <div class="card-body">
        <div class="name">${p.name}</div>
        <div class="meta">${availCount}/${p.items.length} вкусов в наличии</div>
        ${priceHtml}
      </div>
    </div>`;
}

function bindProductGrid(grid){
  grid.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFavorite(btn.dataset.fav);
      haptic('light');
      btn.classList.toggle('active');
      btn.textContent = btn.classList.contains('active') ? '♥' : '♡';
      if(document.getElementById('view-favorites').classList.contains('active')) renderFavorites();
    });
  });
  grid.querySelectorAll('.product-card').forEach(card => {
    card.addEventListener('click', () => openProduct(card.dataset.id));
  });
}

function renderCatalog(){
  buildCatFilters();
  const grid = document.getElementById('productGrid');
  const t = searchTerm.trim().toLowerCase();
  const list = PRODUCTS.filter(p => {
    if(activeCat !== 'all' && p.category !== activeCat) return false;
    if(stockOnly && !p.items.some(i => isAvailable(p.id, i))) return false;
    if(!t) return true;
    if(p.name.toLowerCase().includes(t)) return true;
    return p.items.some(i => i.n.toLowerCase().includes(t));
  });
  list.sort((a, b) => {
    const aHas = a.items.some(i => isAvailable(a.id, i)) ? 0 : 1;
    const bHas = b.items.some(i => isAvailable(b.id, i)) ? 0 : 1;
    return aHas - bHas;
  });
  if(list.length === 0){
    const catMsg = (!t && activeCat !== 'all' && EMPTY_CATEGORY_MSG[activeCat]) ? EMPTY_CATEGORY_MSG[activeCat] : 'Ничего не найдено';
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <div>${catMsg}</div></div>`;
    return;
  }
  grid.innerHTML = list.map(productCardHtml).join('');
  bindProductGrid(grid);
}

function renderFavorites(){
  const grid = document.getElementById('favoritesGrid');
  const list = PRODUCTS.filter(p => favorites.has(p.id));
  if(list.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <div>Список избранного пуст<br><span style="font-size:0.8rem;">Нажимай на ♡ на товаре, чтобы сохранить его сюда</span></div></div>`;
    return;
  }
  grid.innerHTML = list.map(productCardHtml).join('');
  bindProductGrid(grid);
}

const HOME_BANNERS = [
  {img:'banner-1.jpg', alt:'Новости SMOKEEZ'},
  {img:'banner-2.jpg', alt:'Новости SMOKEEZ'},
  {img:'banner-3.jpg', alt:'Новости SMOKEEZ'},
];
const BANNER_INTERVAL_MS = 3000; // как часто баннеры листаются сами
let bannerTimer = null;
function bannerSlideHtml(b){
  return `<div class="banner-slide">
      <img src="${b.img}" alt="${b.alt}"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="banner-ph" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="9.5" r="1.5"/></svg><span>Баннер скоро появится</span></div>
    </div>`;
}
function startBannerAutoplay(){
  stopBannerAutoplay();
  const rail = document.getElementById('homeBanners');
  if(!rail || HOME_BANNERS.length < 2) return;
  let paused = false;
  let resumeTimer = null;
  const pause = () => {
    paused = true;
    clearTimeout(resumeTimer);
    resumeTimer = setTimeout(() => { paused = false; }, 6000);
  };
  rail.addEventListener('touchstart', pause, {passive:true});
  rail.addEventListener('mousedown', pause);
  rail.addEventListener('wheel', pause, {passive:true});
  bannerTimer = setInterval(() => {
    if(paused || !document.getElementById('view-home').classList.contains('active')) return;
    const slide = rail.querySelector('.banner-slide');
    if(!slide) return;
    const step = slide.getBoundingClientRect().width + 10;
    const atEnd = rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 8;
    rail.scrollTo({left: atEnd ? 0 : rail.scrollLeft + step, behavior:'smooth'});
  }, BANNER_INTERVAL_MS);
}
function stopBannerAutoplay(){
  if(bannerTimer){ clearInterval(bannerTimer); bannerTimer = null; }
}

let pdQty = 1;

function openProduct(id){
  currentProductId = id;
  const p = productById(id);
  if(!p) return;
  const firstAvail = p.items.find(i => isAvailable(p.id, i));
  pendingFlavor = firstAvail ? firstAvail.n : null;
  pdQty = 1;
  renderProductDetail();
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-product').classList.add('active');
  window.scrollTo(0,0);
}

function hueFor(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) % 360; }
  return h;
}

function renderProductDetail(){
  const p = productById(currentProductId);
  if(!p) return;
  const body = document.getElementById('productDetailBody');
  const priceHtml = p.price
    ? `<div class="pd-price">${p.price.toFixed(2).replace('.',',')} € <span style="font-size:0.65em;color:var(--muted-dim);font-family:'Manrope',sans-serif;font-style:normal;">/ ${p.unit}</span></div>`
    : `<div class="pd-price ask">Цена по запросу — уточним в переписке</div>`;
  const flavorChips = p.items.map(item => {
    const ok = isAvailable(p.id, item);
    const isSel = pendingFlavor === item.n;
    const hue = hueFor(item.n);
    const dotColor = ok ? `hsl(${hue}, 78%, 62%)` : 'var(--muted-dim)';
    return `<div class="flavor-chip ${ok ? '' : 'out'} ${isSel ? 'selected' : ''}" data-flavor="${encodeURIComponent(item.n)}" data-ok="${ok}">
        <span class="dot" style="background:${isSel ? '#fff' : dotColor}"></span>${item.n}${ok ? '' : ' · нет'}
      </div>`;
  }).join('');
  const canBuy = !!pendingFlavor;
  const favActive = isFavorite(p.id);
  body.innerHTML = `
    <div class="pd-hero">${thumbHtml(p, 'lg').replace('фото скоро будет', 'фото скоро появится')}<button type="button" class="fav-btn ${favActive?'active':''}" id="pdFavBtn">${favActive ? '♥' : '♡'}</button></div>
    <h1 class="pd-title">${p.name}</h1>
    ${priceHtml}
    ${p.desc ? `<p class="pd-desc">${p.desc}</p>` : ''}
    <div class="pd-block">
      <div class="lbl">${p.variantLabel} · выбери один</div>
      <div class="flavor-grid" id="pdFlavorGrid">${flavorChips}</div>
    </div>
    <div class="pd-block">
      <div class="lbl">Количество</div>
      <div class="qty-stepper" id="pdQtyStepper">
        <button type="button" data-d="-1">−</button>
        <span class="val" id="pdQtyVal">${pdQty}</span>
        <button type="button" data-d="1">+</button>
      </div>
    </div>
    <div class="pd-actions">
      <button class="btn btn-ghost" id="pdAddCart" ${canBuy ? '' : 'disabled'}>В корзину</button>
      <button class="btn btn-primary" id="pdBuyNow" ${canBuy ? '' : 'disabled'}>Купить сейчас</button>
    </div>
    ${p.note ? `<div class="pd-note">${p.note}</div>` : ''}
  `;
  body.querySelectorAll('.flavor-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      if(chip.dataset.ok !== 'true') return;
      pendingFlavor = decodeURIComponent(chip.dataset.flavor);
      const r = remainingQty(p.id, pendingFlavor);
      if(r !== null) pdQty = Math.min(pdQty, r);
      haptic('light');
      renderProductDetail();
    });
  });
  const favBtn = document.getElementById('pdFavBtn');
  if(favBtn) favBtn.addEventListener('click', () => {
    toggleFavorite(p.id);
    haptic('light');
    renderProductDetail();
  });
  const stepper = document.getElementById('pdQtyStepper');
  stepper.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = parseInt(btn.dataset.d, 10);
      const r = pendingFlavor ? remainingQty(p.id, pendingFlavor) : null;
      const cap = r !== null ? r : 50;
      if(d > 0 && pdQty >= cap){ showToast(`Больше нет в наличии: ${pendingFlavor}`); haptic('warning'); return; }
      pdQty = Math.min(cap, Math.max(1, pdQty + d));
      document.getElementById('pdQtyVal').textContent = pdQty;
    });
  });
  const addBtn = document.getElementById('pdAddCart');
  const buyBtn = document.getElementById('pdBuyNow');
  if(addBtn) addBtn.addEventListener('click', () => { addToCart(p.id, pendingFlavor, pdQty); showToast('Добавлено в корзину'); haptic('success'); });
  if(buyBtn) buyBtn.addEventListener('click', () => { addToCart(p.id, pendingFlavor, pdQty); haptic('success'); goto('cart'); setTimeout(()=>startCheckout(), 50); });
}

   КОРЗИНА

function persistCart(){ storeSet('smokeez_cart_' + UID, cart); refreshCartBadges(); }

function addToCart(productId, flavor, qty){
  const r = remainingQty(productId, flavor);
  const cap = r !== null ? r : 50;
  const existing = cart.find(ci => ci.productId === productId && ci.flavor === flavor);
  if(existing){ existing.qty = Math.min(cap, existing.qty + qty); }
  else{ cart.push({productId, flavor, qty: Math.min(cap, qty)}); }
  persistCart();
}
function changeCartQty(idx, delta){
  const ci = cart[idx];
  if(!ci) return;
  if(delta > 0){
    const r = remainingQty(ci.productId, ci.flavor);
    const cap = r !== null ? r : 50;
    if(ci.qty >= cap){ showToast(`Больше нет в наличии: ${ci.flavor}`); haptic('warning'); return; }
  }
  ci.qty += delta;
  if(ci.qty <= 0){ cart.splice(idx,1); }
  persistCart();
  renderCart();
}
function removeCartItem(idx){
  cart.splice(idx,1);
  persistCart();
  renderCart();
}

function renderCart(){
  refreshCartBadges();
  const body = document.getElementById('cartBody');
  if(cart.length === 0){
    body.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      <div>Корзина пуста<br><span style="font-size:0.8rem;">Загляни в каталог и выбери что-нибудь вкусное</span></div>
    </div>`;
    return;
  }
  const rows = cart.map((ci, idx) => {
    const p = productById(ci.productId);
    if(!p) return '';
    const lineTotal = p.price ? (p.price * ci.qty) : null;
    return `<div class="cart-item">
        <div class="thumb-sm">${thumbHtml(p, 'sm')}</div>
        <div class="ci-info">
          <div class="ci-name">${p.name}</div>
          <div class="ci-flavor">${ci.flavor}</div>
          <div class="ci-row">
            <div class="qty-stepper" data-idx="${idx}">
              <button type="button" data-d="-1">−</button>
              <span class="val">${ci.qty}</span>
              <button type="button" data-d="1">+</button>
            </div>
            <span class="ci-price">${lineTotal!==null ? lineTotal.toFixed(2).replace('.',',')+' €' : 'по запросу'}</span>
          </div>
        </div>
        <button class="rm" data-idx="${idx}">✕</button>
      </div>`;
  }).join('');
  const total = cartTotal();
  const hasAsk = cart.some(ci => { const p = productById(ci.productId); return p && p.price===null; });
  body.innerHTML = rows + `
    <div class="cart-summary">
      <div class="row"><span>Товаров</span><span>${cartCount()} шт</span></div>
      <div class="row total"><span>Итого</span><span>${total.toFixed(2).replace('.',',')} €${hasAsk ? ' +' : ''}</span></div>
      ${hasAsk ? '<div class="row" style="font-size:0.72rem;">+ позиции с ценой по запросу — сумма уточняется в переписке</div>' : ''}
    </div>
    <button class="btn btn-primary btn-wide btn-block" id="cartCheckoutBtn" style="margin-top:16px;">Оформить заказ</button>
  `;
  body.querySelectorAll('.qty-stepper').forEach(st => {
    st.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => changeCartQty(parseInt(st.dataset.idx,10), parseInt(btn.dataset.d,10)));
    });
  });
  body.querySelectorAll('.rm').forEach(btn => {
    btn.addEventListener('click', () => removeCartItem(parseInt(btn.dataset.idx,10)));
  });
  const coBtn = document.getElementById('cartCheckoutBtn');
  if(coBtn) coBtn.addEventListener('click', () => { goto('checkout'); startCheckout(); });
}

        <span class="radio" id="age21Radio"></span>
        <span>Подтверждаю, что мне есть 21 год</span>
      </label>
    </div>

    <div class="co-step">
      <div class="co-title"><span class="n">7</span>Ваш заказ</div>
      ${cart.map(ci => { const p = productById(ci.productId); if(!p) return ''; const lt = p.price ? (p.price*ci.qty).toFixed(2).replace('.',',')+' €' : 'по запросу';
        return `<div class="order-review-row"><span>${p.name} · ${ci.flavor} × ${ci.qty}</span><span>${lt}</span></div>`; }).join('')}
      ${checkout.promo ? `<div class="order-review-row"><span>Скидка по промокоду ${checkout.promo.code}</span><span style="color:var(--ok);">−${checkout.promo.amount ? checkout.promo.amount + ' €' : checkout.promo.percent + '%'}</span></div>` : ''}
      <div class="order-review-row" style="border:none;font-weight:800;color:var(--text);padding-top:10px;"><span>Итого</span><span style="color:var(--magenta);">${cartDiscountedTotal().toFixed(2).replace('.',',')} €</span></div>
    </div>

    <div id="coError" class="co-error" style="display:none;"></div>
    <button class="btn btn-primary btn-wide btn-block" id="submitOrderBtn" style="margin-top:6px;">Подтвердить заказ</button>
  `;

  body.querySelectorAll('[data-method]').forEach(btn => {
    btn.addEventListener('click', () => { checkout.method = btn.dataset.method; renderCheckout(); });
  });
  body.querySelectorAll('[data-ctype]').forEach(btn => {
    btn.addEventListener('click', () => { checkout.contactType = btn.dataset.ctype; checkout.contactValue=''; renderCheckout(); });
  });
  body.querySelectorAll('[data-pay]').forEach(el => {
    el.addEventListener('click', () => { checkout.payment = el.dataset.pay; renderCheckout(); });
  });

  const bind = (id, key) => { const el = document.getElementById(id); if(el) el.addEventListener('input', () => { checkout[key] = el.value; }); };
  bind('fName','name'); bind('fStreet','street'); bind('fHouse','house'); bind('fCity','city');
  bind('fPostal','postal'); bind('fPhone','phone'); bind('fEmail','email'); bind('fContact','contactValue');

  const promoApplyBtn = document.getElementById('promoApplyBtn');
  if(promoApplyBtn) promoApplyBtn.addEventListener('click', () => {
    const val = document.getElementById('fPromo').value;
    const res = findPromo(val);
    const errBox = document.getElementById('promoError');
    if(!res.ok){
      errBox.style.display = 'block';
      errBox.textContent = res.error;
      haptic('error');
      return;
    }
    checkout.promo = {code: res.code, percent: res.percent, amount: res.amount, kind: res.kind};
    haptic('success');
    showToast('Промокод применён');
    renderCheckout();
  });
  const promoRemoveBtn = document.getElementById('promoRemoveBtn');
  if(promoRemoveBtn) promoRemoveBtn.addEventListener('click', () => { checkout.promo = null; renderCheckout(); });

  const age21Box = document.getElementById('fAge21');
  if(age21Box) age21Box.closest('label').addEventListener('click', (e) => {
    e.preventDefault();
    checkout.age21 = !checkout.age21;
    renderCheckout();
  });

  document.getElementById('submitOrderBtn').addEventListener('click', submitOrder);
}

function validateCheckout(){
  const errs = [];
  if(!checkout.name || checkout.name.trim().length < 2) errs.push('Укажи своё имя');
  if(checkout.method === 'delivery'){
    if(!checkout.street) errs.push('Укажи улицу');
    if(!checkout.house) errs.push('Укажи номер дома');
    if(!checkout.city) errs.push('Укажи город');
    if(!checkout.postal) errs.push('Укажи индекс');
    if(!checkout.phone || !/^\+?[0-9\s()-]{6,}$/.test(checkout.phone)) errs.push('Укажи корректный номер телефона');
    if(!checkout.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(checkout.email)) errs.push('Укажи корректный e-mail');
  }
  if(!checkout.contactValue) errs.push('Укажи контакт для связи');
  else if(checkout.contactType === 'telegram' && !checkout.contactValue.trim().startsWith('@')) errs.push('Telegram-юзернейм должен начинаться с @');
  else if(checkout.contactType === 'phone' && !checkout.contactValue.trim().startsWith('+')) errs.push('Номер телефона должен начинаться с +');
  if(!checkout.age21) errs.push('Подтверди, что тебе есть 21 год');
  return errs;
}

function buildOrderText(){
  const payLabels = {card:'Карта', crypto:'Криптовалюта', cash:'Наличные'};
  let text = `🛒 <b>Новый заказ ${CONFIG.SHOP_NAME}</b>\n\n`;
  cart.forEach(ci => {
    const p = productById(ci.productId);
    if(!p) return;
    const lt = p.price ? (p.price*ci.qty).toFixed(2).replace('.',',')+' €' : 'цена по запросу';
    text += `• ${p.name} — ${ci.flavor} × ${ci.qty} (${lt})\n`;
  });
  if(checkout.promo) text += `\n🏷 Применён промокод: ${checkout.promo.code} (−${checkout.promo.amount ? checkout.promo.amount + ' €' : checkout.promo.percent + '%'})\n💰 Сумма без скидки: ${cartTotal().toFixed(2).replace('.',',')} €\n💰 Итого к оплате: ${cartDiscountedTotal().toFixed(2).replace('.',',')} €\n`;
  else text += `\n💰 Итого: ${cartTotal().toFixed(2).replace('.',',')} €\n`;
  text += `\n📦 Способ: ${checkout.method === 'delivery' ? 'Доставка' : 'Самовывоз'}\n`;
  text += `👤 Имя: ${checkout.name}\n`;
  if(checkout.method === 'delivery'){
    text += `🏠 Адрес: ${checkout.street} ${checkout.house}, ${checkout.city}, ${checkout.postal}\n`;
    text += `📞 Телефон: ${checkout.phone}\n`;
    text += `✉️ Email: ${checkout.email}\n`;
  }
  text += `💬 Связь: ${checkout.contactValue} (${checkout.contactType === 'telegram' ? 'Telegram' : 'телефон'})\n`;
  text += `💳 Оплата: ${payLabels[checkout.payment]}\n`;
  text += `🔞 21+: подтверждено\n`;
  if(tgUser) text += `\n🆔 Telegram: ${tgUser.first_name||''} ${tgUser.username ? '(@'+tgUser.username+')' : ''} · id ${tgUser.id}\n`;
  text += `🏷 Личный промокод клиента: ${getPromoCode()}`;
  return text;
}

async function sendOrderToOwner(text){
  const ready = CONFIG.ORDER_ENDPOINT && CONFIG.ORDER_ENDPOINT !== 'YOUR_WORKER_URL';
  if(!ready) return {ok:false, error:'Сервер не настроен'};
  let lastError = 'Нет связи с сервером';
  for(let attempt = 0; attempt < 2; attempt++){
    try{
      const resp = await fetch(CONFIG.ORDER_ENDPOINT, {
        method:'POST',
        headers:{'Content-Type':'application/json', 'X-App-Key': CONFIG.APP_KEY},
        body: JSON.stringify({text})
      });
      const data = await resp.json();
      if(data.ok) return {ok:true};
      lastError = data.error || 'Сервер отклонил запрос';
    }catch(e){
      lastError = 'Нет связи с сервером';
    }
    if(attempt === 0) await new Promise(r => setTimeout(r, 1200));
  }
  return {ok:false, error:lastError};
}

async function submitOrder(){
  const errs = validateCheckout();
  const errBox = document.getElementById('coError');
  if(errs.length){
    errBox.style.display = 'block';
    errBox.innerHTML = errs.map(e => '• '+e).join('<br>');
    errBox.scrollIntoView({behavior:'smooth', block:'center'});
    haptic('error');
    return;
  }
  errBox.style.display = 'none';
  const btn = document.getElementById('submitOrderBtn');
  btn.disabled = true; btn.textContent = 'Отправляем...';

  const orderText = buildOrderText();
  const sent = await sendOrderToOwner(orderText);

  if(!sent.ok){
    // заказ НЕ отправлен — ничего не списываем и не очищаем корзину,
    // чтобы клиент мог просто попробовать ещё раз
    btn.disabled = false; btn.textContent = 'Подтвердить заказ';
    errBox.style.display = 'block';
    errBox.innerHTML = `Не удалось отправить заказ (${sent.error}). Проверь соединение и нажми «Подтвердить заказ» ещё раз.`;
    errBox.scrollIntoView({behavior:'smooth', block:'center'});
    haptic('error');
    return;
  }

  // списываем реально купленные единицы с живого остатка склада
  cart.forEach(ci => decrementStock(ci.productId, ci.flavor, ci.qty));

  const finalTotal = cartDiscountedTotal();
  const earnedPoints = Math.floor(finalTotal / 10) * POINTS_PER_10_EUR;
  applyPromoSideEffects(checkout.promo);
  addPoints(earnedPoints);

  orders.unshift({
    date: new Date().toISOString(), items: cart.map(ci=>({...ci})),
    total: finalTotal, promo: checkout.promo ? checkout.promo.code : null,
    method: checkout.method, payment: checkout.payment, pointsEarned: earnedPoints
  });
  storeSet('smokeez_orders_' + UID, orders.slice(0,30));
  cart = [];
  persistCart();
  haptic('success');

  document.getElementById('checkoutBody').innerHTML = `
    <div class="success-box">
      <div class="ic">✅</div>
      <h2>Заказ принят!</h2>
      <p>Мы свяжемся с тобой в Telegram (${checkout.contactValue}) в ближайшее время, чтобы подтвердить заказ и прислать реквизиты для оплаты.</p>
      ${earnedPoints > 0 ? `<p style="margin-top:8px;color:var(--gold);font-weight:700;">+${earnedPoints} SMOKEY-POINTS начислено на твой счёт</p>` : ''}
      <button class="btn btn-primary" style="margin-top:20px;" id="backToCatalogBtn">В каталог</button>
    </div>`;
  document.getElementById('backToCatalogBtn').addEventListener('click', () => goto('home'));
}

async function syncStockFromSheet(){
  const ready = CONFIG.ORDER_ENDPOINT && CONFIG.ORDER_ENDPOINT !== 'YOUR_WORKER_URL';
  if(!ready) return;
  try{
    const resp = await fetch(CONFIG.ORDER_ENDPOINT + '?stock=1', {
      method:'GET',
      headers:{'X-App-Key': CONFIG.APP_KEY}
    });
    if(!resp.ok) return;
    const csv = await resp.text();
    const rows = parseStockCsv(csv);
    let updated = 0;
    rows.forEach(row => {
      const product = PRODUCTS.find(p => p.name.trim().toLowerCase() === row.product.trim().toLowerCase());
      if(!product) return;
      const item = product.items.find(i => i.n.trim().toLowerCase() === row.flavor.trim().toLowerCase());
      if(!item) return;
      STOCK[stockKey(product.id, item.n)] = row.stock;
      updated++;
    });
    if(updated){
      storeSet('smokeez_stock_v1', STOCK);
      if(typeof renderHome === 'function') renderHome();
      if(typeof renderCatalog === 'function') renderCatalog();
    }
  }catch(e){
    // тихо игнорируем — просто останутся текущие цифры, зашитые в коде
  }
}
function parseStockCsv(text){
  const lines = text.trim().split(/\r?\n/).map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g,'')));
  if(lines.length < 2) return [];
  const header = lines.shift().map(h => h.toLowerCase());
  const pI = header.indexOf('product');
  const fI = header.indexOf('flavor');
  const sI = header.indexOf('stock');
  if(pI === -1 || fI === -1 || sI === -1) return [];
  return lines.filter(r => r.length > sI).map(r => ({
    product: r[pI], flavor: r[fI], stock: parseInt(r[sI], 10)
  })).filter(r => r.product && r.flavor && !isNaN(r.stock));
}
syncStockFromSheet();
